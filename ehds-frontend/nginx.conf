user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Basic security headers
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # CSP: Allow self (the domain itself) for connections.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;
        
        # Prevent clickjacking
        add_header X-Frame-Options "DENY" always;

        # Prevent MIME sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # XSS protection for older browsers
        add_header X-XSS-Protection "1; mode=block" always;

        # Content Security Policy — restrict script/style sources
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

        # Referrer policy — don't leak URL to external resources
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Serve static React app
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Secure Reverse Proxy to the Backend API
        # Using a variable for proxy_pass and a resolver forces Nginx to re-resolve the IP, 
        # avoiding "Host is unreachable" errors when containers restart.
        resolver 127.0.0.11 valid=30s;
        
        location /api/ {
            set $upstream_api http://api:8000;
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Increase timeouts for LLM processing
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            
            # Allow large file uploads
            client_max_body_size 50M;
        }
    }
}
