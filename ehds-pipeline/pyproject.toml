[project]
name = "ehds-pipeline"
version = "0.1.0"
description = "EHDS-compliant health information system backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic[email]",
    "pydantic-settings",
    "openai",
    "instructor",
    "fhir.resources>=7.0",
    "pdfplumber",
    "pymupdf",
    "pytesseract",
    "pdf2image",
    "asyncpg",
    "httpx",
    "loguru",
    "python-multipart",
    "python-docx",
    "Pillow"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
