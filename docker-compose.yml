# ─────────────────────────────────────────────────────────────────────
# EHDS Service — docker-compose
#
# Services:
#   frontend      React SPA (Vite/Nginx) — port 8018
#   api           FastAPI extraction pipeline — port 8000
#   hapi-fhir     HAPI FHIR R4 server (internal, no host port)
#   postgres      PostgreSQL 16 — internal
#   snowstorm-es  Elasticsearch 8.11 (Snowstorm backend) — internal
#   snowstorm     SNOMED CT terminology server (FHIR API) — port 8085
#
# ── Loading SNOMED CT into Snowstorm ──────────────────────────────────
# Snowstorm starts EMPTY. You must load a SNOMED CT RF2 snapshot once
# after the stack is up. Steps:
#
#   1. Obtain the SNOMED CT International Edition RF2 zip from:
#      https://www.snomed.org/snomed-ct/get-snomed
#      (free licence required)
#
#   2. Create an import job:
#      curl -s -X POST http://localhost:8085/imports \
#        -H 'Content-Type: application/json' \
#        -d '{"branchPath":"MAIN","createCodeSystemVersion":true,"type":"SNAPSHOT"}' \
#        | jq -r '.id'   # note the import id
#
#   3. Upload the RF2 zip (takes 30-60 min):
#      curl -X POST \
#        "http://localhost:8085/imports/<import-id>/archive" \
#        -F file=@SnomedCT_InternationalRF2_PRODUCTION_*.zip
#
# The Elasticsearch volume (snowstorm-es-data) persists across restarts.
# ─────────────────────────────────────────────────────────────────────

services:
  frontend:
    build:
      context: ./ehds-frontend
      dockerfile: Dockerfile
    ports:
      - "8018:80"
    networks:
      - ehds-network
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./ehds-pipeline
      dockerfile: Dockerfile
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - HAPI_FHIR_BASE_URL=http://hapi-fhir:8080/fhir
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ehds_db
      - SNOWSTORM_URL=http://snowstorm:8080/fhir
    volumes:
      - api-logs:/app/logs
    networks:
      - ehds-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      hapi-fhir:
        condition: service_started
      postgres:
        condition: service_started
      snowstorm:
        condition: service_started

  hapi-fhir:
    image: hapiproject/hapi:latest
    environment:
      - HAPI_FHIR_SERVER_ADDRESS=http://hapi-fhir:8080/fhir
    volumes:
      - hapi-data:/var/lib/hapi
    networks:
      - ehds-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/fhir/metadata"]
      interval: 30s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ehds_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ehds-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Snowstorm: SNOMED CT FHIR terminology server ───────────────────
  # Requires Elasticsearch as its data backend.
  # Swagger UI (once SNOMED loaded): http://localhost:8085
  # FHIR endpoint:                   http://localhost:8085/fhir
  # Elasticsearch requires vm.max_map_count >= 262144 set on the HOST kernel.
  # This init container runs once with host privileges and exits cleanly.
  # snowstorm-es waits for it to complete before starting.
  snowstorm-sysctl:
    image: busybox
    command: sysctl -w vm.max_map_count=262144
    privileged: true
    network_mode: none
    restart: "no"

  snowstorm-es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    environment:
      - node.name=snowstorm-es
      - cluster.name=snowstorm-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    depends_on:
      snowstorm-sysctl:
        condition: service_completed_successfully
    volumes:
      - snowstorm-es-data:/usr/share/elasticsearch/data
    networks:
      - ehds-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - |
          curl -sf "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s" \
          | grep -qE '"status":"(green|yellow)"'
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s

  snowstorm:
    image: snomedinternational/snowstorm:latest
    entrypoint: >
      java -Xms2g -Xmx4g
      -cp @/app/jib-classpath-file
      org.snomed.snowstorm.SnowstormApplication
      --elasticsearch.urls=http://snowstorm-es:9200
    ports:
      - "8085:8080"
    networks:
      - ehds-network
    restart: unless-stopped
    depends_on:
      snowstorm-es:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/fhir/metadata"]
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 120s

networks:
  ehds-network:
    driver: bridge

volumes:
  hapi-data:
  postgres-data:
  api-logs:
  snowstorm-es-data:
