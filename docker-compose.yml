# ─────────────────────────────────────────────────────────────────────
# EHDS Service — docker-compose
#
# Services:
#   frontend   React SPA (Vite/Nginx) — port 8018
#   api        FastAPI extraction pipeline — port 8000
#   hapi-fhir  HAPI FHIR R4 server (internal)
#   postgres   PostgreSQL 16 (internal)
#
# SNOMED CT terminology validation uses the public Snowstorm server:
#   https://snowstorm.snomedtools.org/fhir
# ─────────────────────────────────────────────────────────────────────

services:
  frontend:
    build:
      context: ./ehds-frontend
      dockerfile: Dockerfile
    ports:
      - "8018:80"
    networks:
      - ehds-network
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./ehds-pipeline
      dockerfile: Dockerfile
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-google/gemma-4-26b-a4b-it:free}
      - HAPI_FHIR_BASE_URL=http://hapi-fhir:8080/fhir
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ehds_db
    volumes:
      - api-logs:/app/logs
    networks:
      - ehds-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      hapi-fhir:
        condition: service_started
      postgres:
        condition: service_started

  hapi-fhir:
    image: hapiproject/hapi:latest
    environment:
      - HAPI_FHIR_SERVER_ADDRESS=http://hapi-fhir:8080/fhir
    volumes:
      - hapi-data:/var/lib/hapi
    networks:
      - ehds-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/fhir/metadata"]
      interval: 30s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ehds_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ehds-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ehds-network:
    driver: bridge

volumes:
  hapi-data:
  postgres-data:
  api-logs:
