<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f8ef7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4b4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f8ef7;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#4f8ef7;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#00d4b4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4b4;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#4f8ef7" stroke-width="0.5">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="400" y1="0" x2="400" y2="280"/>
    <line x1="500" y1="0" x2="500" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/>
    <line x1="700" y1="0" x2="700" y2="280"/>
    <line x1="800" y1="0" x2="800" y2="280"/>
    <line x1="900" y1="0" x2="900" y2="280"/>
    <line x1="1000" y1="0" x2="1000" y2="280"/>
    <line x1="1100" y1="0" x2="1100" y2="280"/>
  </g>

  <!-- Left decorative circuit nodes -->
  <g opacity="0.15" fill="#4f8ef7">
    <circle cx="60" cy="70" r="3"/>
    <circle cx="60" cy="140" r="3"/>
    <circle cx="60" cy="210" r="3"/>
    <circle cx="120" cy="105" r="2"/>
    <circle cx="120" cy="175" r="2"/>
    <line x1="60" y1="70" x2="120" y2="105" stroke="#4f8ef7" stroke-width="1"/>
    <line x1="60" y1="140" x2="120" y2="105" stroke="#4f8ef7" stroke-width="1"/>
    <line x1="60" y1="140" x2="120" y2="175" stroke="#4f8ef7" stroke-width="1"/>
    <line x1="60" y1="210" x2="120" y2="175" stroke="#4f8ef7" stroke-width="1"/>
  </g>

  <!-- Right decorative circuit nodes -->
  <g opacity="0.15" fill="#00d4b4">
    <circle cx="1140" cy="70" r="3"/>
    <circle cx="1140" cy="140" r="3"/>
    <circle cx="1140" cy="210" r="3"/>
    <circle cx="1080" cy="105" r="2"/>
    <circle cx="1080" cy="175" r="2"/>
    <line x1="1140" y1="70" x2="1080" y2="105" stroke="#00d4b4" stroke-width="1"/>
    <line x1="1140" y1="140" x2="1080" y2="105" stroke="#00d4b4" stroke-width="1"/>
    <line x1="1140" y1="140" x2="1080" y2="175" stroke="#00d4b4" stroke-width="1"/>
    <line x1="1140" y1="210" x2="1080" y2="175" stroke="#00d4b4" stroke-width="1"/>
  </g>

  <!-- EU circle of stars (left side icon) -->
  <g transform="translate(200, 140)" filter="url(#softglow)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.4"/>
    <!-- 12 EU stars -->
    <g fill="#FFD700" opacity="0.9">
      <!-- Star at top (0°) -->
      <text x="0" y="-38" text-anchor="middle" font-size="10" dominant-baseline="middle">&#9733;</text>
      <!-- 30° -->
      <text x="19" y="-33" text-anchor="middle" font-size="10" dominant-baseline="middle">&#9733;</text>
      <!-- 60° -->
      <text x="33" y="-19" text-anchor="middle" font-size="10" dominant-baseline="middle">&#9733;</text>
      <!-- 90° -->
      <text x="38" y="0" text-anchor="middle" font-size="10" dominant-baseline="middle">&#9733;</text>
      <!-- 120° -->
      <text x="33" y="19" text-anchor="middle" font-size="10" dominant-baseline="middle">&#9733;</text>
      <!-- 150° -->
      <text x="19" y="33" text-anchor="middle" font-size="10" dominant-baseline="middle">&#9733;</text>
      <!-- 180° -->
      <text x="0" y="38" text-anchor="middle" font-size="10" dominant-baseline="middle">&#9733;</text>
      <!-- 210° -->
      <text x="-19" y="33" text-anchor="middle" font-size="10" dominant-baseline="middle">&#9733;</text>
      <!-- 240° -->
      <text x="-33" y="19" text-anchor="middle" font-size="10" dominant-baseline="middle">&#9733;</text>
      <!-- 270° -->
      <text x="-38" y="0" text-anchor="middle" font-size="10" dominant-baseline="middle">&#9733;</text>
      <!-- 300° -->
      <text x="-33" y="-19" text-anchor="middle" font-size="10" dominant-baseline="middle">&#9733;</text>
      <!-- 330° -->
      <text x="-19" y="-33" text-anchor="middle" font-size="10" dominant-baseline="middle">&#9733;</text>
    </g>
    <!-- Medical cross in center -->
    <rect x="-8" y="-18" width="16" height="36" rx="3" fill="url(#accentGrad)" opacity="0.9"/>
    <rect x="-18" y="-8" width="36" height="16" rx="3" fill="url(#accentGrad)" opacity="0.9"/>
  </g>

  <!-- Main accent line -->
  <rect x="0" y="275" width="1200" height="3" fill="url(#lineGrad)"/>

  <!-- Top accent line -->
  <rect x="0" y="2" width="1200" height="2" fill="url(#lineGrad)" opacity="0.5"/>

  <!-- EHDS SERVICE title -->
  <text x="600" y="118" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="62" font-weight="700" letter-spacing="6" filter="url(#softglow)">
    <tspan fill="url(#accentGrad)">EHDS</tspan>
    <tspan fill="#ffffff"> Service</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="164" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#a8c4e8" letter-spacing="1" opacity="0.9">
    Romanian Medical Records  →  HL7 FHIR R4 Bundles
  </text>

  <!-- Tag line -->
  <text x="600" y="198" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="300" fill="#6a8db5" letter-spacing="2">
    EU Regulation 2025/327  ·  Dual-Pillar Compliance  ·  9-Stage AI Pipeline
  </text>

  <!-- Version badge area - decorative tags -->
  <g transform="translate(600, 232)">
    <!-- FHIR R4 pill -->
    <rect x="-225" y="-12" width="80" height="22" rx="11" fill="#0a3d6b" stroke="#4f8ef7" stroke-width="1" opacity="0.8"/>
    <text x="-185" y="3" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#4f8ef7" font-weight="600">FHIR R4</text>

    <!-- FastAPI pill -->
    <rect x="-130" y="-12" width="76" height="22" rx="11" fill="#0a3d3a" stroke="#00d4b4" stroke-width="1" opacity="0.8"/>
    <text x="-92" y="3" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#00d4b4" font-weight="600">FastAPI</text>

    <!-- React pill -->
    <rect x="-40" y="-12" width="66" height="22" rx="11" fill="#0a2d4d" stroke="#61dafb" stroke-width="1" opacity="0.8"/>
    <text x="7" y="3" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#61dafb" font-weight="600">React 19</text>

    <!-- Python pill -->
    <rect x="40" y="-12" width="76" height="22" rx="11" fill="#1a2d0a" stroke="#3fb950" stroke-width="1" opacity="0.8"/>
    <text x="78" y="3" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#3fb950" font-weight="600">Python 3.12</text>

    <!-- Docker pill -->
    <rect x="130" y="-12" width="68" height="22" rx="11" fill="#0a2040" stroke="#1d97c8" stroke-width="1" opacity="0.8"/>
    <text x="164" y="3" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#1d97c8" font-weight="600">Docker</text>
  </g>
</svg>
