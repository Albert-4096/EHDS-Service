<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e2e"/>
      <stop offset="100%" style="stop-color:#0d1b3a"/>
    </linearGradient>
    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2d5a"/>
      <stop offset="100%" style="stop-color:#0f1e42"/>
    </linearGradient>
    <linearGradient id="outGradP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a3d2a"/>
      <stop offset="100%" style="stop-color:#061e15"/>
    </linearGradient>
    <linearGradient id="outGradP2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d1a0a"/>
      <stop offset="100%" style="stop-color:#1e0a06"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8ef7"/>
      <stop offset="100%" style="stop-color:#00d4b4"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f8ef7"/>
    </marker>
    <marker id="arrowhead2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00d4b4"/>
    </marker>
    <marker id="arrowhead3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f0c040"/>
    </marker>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="520" fill="url(#bg2)" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#a8c4e8" letter-spacing="2">9-STAGE EXTRACTION PIPELINE</text>
  <line x1="100" y1="46" x2="800" y2="46" stroke="#4f8ef7" stroke-width="0.5" opacity="0.4"/>

  <!-- INPUT -->
  <rect x="360" y="58" width="180" height="44" rx="8" fill="#1a2050" stroke="#4f8ef7" stroke-width="1.5"/>
  <text x="450" y="75" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#4f8ef7">PDF Upload</text>
  <text x="450" y="92" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#6a8db5">Scanned · Digital · Forms</text>

  <!-- Arrow 0 -->
  <line x1="450" y1="102" x2="450" y2="118" stroke="#4f8ef7" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Stage 0 -->
  <rect x="310" y="120" width="280" height="44" rx="8" fill="url(#stageGrad)" stroke="#4f8ef7" stroke-width="1"/>
  <text x="380" y="137" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#4f8ef7">S0</text>
  <text x="450" y="137" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c8d8f0">Forensics</text>
  <text x="450" y="154" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#6a8db5">PDF type detection · AcroForm detection</text>

  <!-- Arrow 1 -->
  <line x1="450" y1="164" x2="450" y2="180" stroke="#4f8ef7" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Stage 1 + 1b side by side -->
  <rect x="190" y="182" width="240" height="44" rx="8" fill="url(#stageGrad)" stroke="#4f8ef7" stroke-width="1"/>
  <text x="230" y="199" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#4f8ef7">S1</text>
  <text x="310" y="199" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c8d8f0">Text Extraction</text>
  <text x="310" y="216" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#6a8db5">pdfplumber · pytesseract (RO)</text>

  <rect x="470" y="182" width="240" height="44" rx="8" fill="url(#stageGrad)" stroke="#4f8ef7" stroke-width="1"/>
  <text x="510" y="199" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#4f8ef7">S1b</text>
  <text x="590" y="199" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c8d8f0">Checkbox Detection</text>
  <text x="590" y="216" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#6a8db5">AcroForm → Unicode mapping</text>

  <!-- Arrows from S0 to S1 and S1b -->
  <line x1="420" y1="164" x2="310" y2="180" stroke="#4f8ef7" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="164" x2="590" y2="180" stroke="#4f8ef7" stroke-width="1.2" marker-end="url(#arrowhead)"/>

  <!-- Arrows from S1/S1b down to S2 -->
  <line x1="310" y1="226" x2="380" y2="242" stroke="#4f8ef7" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="226" x2="520" y2="242" stroke="#4f8ef7" stroke-width="1.2" marker-end="url(#arrowhead)"/>

  <!-- Stage 2 -->
  <rect x="310" y="244" width="280" height="44" rx="8" fill="url(#stageGrad)" stroke="#4f8ef7" stroke-width="1"/>
  <text x="380" y="261" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#4f8ef7">S2</text>
  <text x="450" y="261" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c8d8f0">Classification</text>
  <text x="450" y="278" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#6a8db5">DOC_HDR · DOC_BIS · DOC_SM</text>

  <!-- Arrow -->
  <line x1="450" y1="288" x2="450" y2="304" stroke="#4f8ef7" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Stage 3 + 4 -->
  <rect x="190" y="306" width="240" height="44" rx="8" fill="url(#stageGrad)" stroke="#4f8ef7" stroke-width="1"/>
  <text x="230" y="323" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#4f8ef7">S3</text>
  <text x="310" y="323" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c8d8f0">Zone Detection</text>
  <text x="310" y="340" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#6a8db5">Anchor-based segmentation</text>

  <rect x="470" y="306" width="240" height="44" rx="8" fill="url(#stageGrad)" stroke="#f0c040" stroke-width="1"/>
  <text x="510" y="323" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#f0c040">S4</text>
  <text x="590" y="323" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c8d8f0">LLM Extraction</text>
  <text x="590" y="340" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#6a8db5">Gemini 2.5 Flash · instructor</text>

  <line x1="420" y1="288" x2="310" y2="304" stroke="#4f8ef7" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="288" x2="590" y2="304" stroke="#f0c040" stroke-width="1.2" marker-end="url(#arrowhead3)"/>

  <!-- S3 → S5, S4 → S5 -->
  <line x1="310" y1="350" x2="380" y2="366" stroke="#4f8ef7" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="350" x2="520" y2="366" stroke="#4f8ef7" stroke-width="1.2" marker-end="url(#arrowhead)"/>

  <!-- Stage 5 -->
  <rect x="310" y="368" width="280" height="44" rx="8" fill="url(#stageGrad)" stroke="#4f8ef7" stroke-width="1"/>
  <text x="380" y="385" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#4f8ef7">S5</text>
  <text x="450" y="385" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c8d8f0">Pydantic Validation</text>
  <text x="450" y="402" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#6a8db5">CoreSetError detection · SNOMED CT</text>

  <!-- Split arrow to Pillar 1 and Pillar 2 -->
  <line x1="390" y1="412" x2="250" y2="428" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowhead2)"/>
  <line x1="510" y1="412" x2="650" y2="428" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrowhead3)"/>

  <!-- Label -->
  <text x="290" y="426" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#3fb950" font-weight="600">Pillar 1</text>
  <text x="610" y="426" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#f97316" font-weight="600">Pillar 2</text>

  <!-- Pillar 1 output -->
  <rect x="90" y="432" width="220" height="44" rx="8" fill="url(#outGradP1)" stroke="#3fb950" stroke-width="1.5"/>
  <text x="200" y="449" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#3fb950">S6-7: FHIR R4 Bundle</text>
  <text x="200" y="466" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#5a9d6b">Direct Care · Full Data</text>

  <!-- Pillar 2 output -->
  <rect x="590" y="432" width="220" height="44" rx="8" fill="url(#outGradP2)" stroke="#f97316" stroke-width="1.5"/>
  <text x="700" y="449" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#f97316">S8: k-Anonymization</text>
  <text x="700" y="466" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#9d6a3a">Research · Temporal shift</text>

  <!-- Bottom legend -->
  <text x="450" y="498" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#3a4d6a">Stage 9: Async HAPI FHIR upload (both pillars)</text>
</svg>
