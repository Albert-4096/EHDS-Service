
<div id="mermaid-container" style="padding: 1rem 0; overflow-x: auto;"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    primaryColor: dark ? '#2a2860' : '#EEEDFE',
    primaryTextColor: dark ? '#CECBF6' : '#26215C',
    primaryBorderColor: dark ? '#534AB7' : '#7F77DD',
    secondaryColor: dark ? '#083428' : '#E1F5EE',
    secondaryTextColor: dark ? '#9FE1CB' : '#04342C',
    secondaryBorderColor: dark ? '#0F6E56' : '#1D9E75',
    tertiaryColor: dark ? '#411802' : '#FAEEDA',
    tertiaryTextColor: dark ? '#FAC775' : '#412402',
    tertiaryBorderColor: dark ? '#854F0B' : '#EF9F27',
    errorBkgColor: dark ? '#501313' : '#FCEBEB',
    errorTextColor: dark ? '#F7C1C1' : '#A32D2D',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    nodeBorder: dark ? '#534AB7' : '#7F77DD',
    clusterBkg: dark ? '#1a1a28' : '#f8f8fe',
    titleColor: dark ? '#CECBF6' : '#26215C',
    edgeLabelBackground: dark ? '#2c2c2a' : '#f1efe8',
  },
  flowchart: { curve: 'basis', padding: 20 }
});

const diagram = `flowchart TD
    INPUT([UploadFile PDF or DOCX]):::io --> S0

    S0["Stage 0
    detect_file_type
    out: DocumentForensics"]:::core --> S1
    S0 --> S1B

    S1["Stage 1
    extract_text
    out: raw text str"]:::core --> S2
    S1 --> S1B

    S1B["Stage 1B  R8 VIOLATED
    extract_checkboxes
    out: list of CheckboxGroup"]:::warn --> S4C

    S2["Stage 2
    classify_document
    out: DocumentType"]:::core --> S3

    S3["Stage 3
    split_zones
    out: dict zone to text"]:::core --> S4A
    S3 --> S4B
    S3 --> S4D
    S3 --> S4E
    S3 --> S4F
    S3 --> S4G

    subgraph stage4 ["Stage 4 — Parallel Extraction"]
      S4A["4A  extract_demographics
      out: StructuredFields"]:::core
      S4B["4B  extract_labs
      out: LabResults"]:::core
      S4C["4C  map_checkboxes
      out: AdminCheckboxes"]:::core
      S4D["4D  HP-09 DROPPED
      extract_appointment
      out: AppointmentBlock
      dropped in Stage 6"]:::missing
      S4E["4E  LLM epicriza
      out: EpicrizaExtracted
      R1 violated"]:::warn
      S4F["4F  extract_medications
      out: list of MedicationEntry"]:::core
      S4G["4G  extract_oncology
      out: OncologyFields"]:::core
    end

    S4E --> S4G

    S4A --> S5
    S4B --> S5
    S4C --> S5
    S4D --> S5
    S4E --> S5
    S4F --> S5
    S4G --> S5

    S5["Stage 5
    merge_and_validate
    out: MergedRecord
    R7 violated — no CoreSetError raised"]:::warn --> S8OPT

    S8OPT{"/extract/secondary?"}:::decision
    S8OPT -- Yes --> S8
    S8OPT -- No --> S6

    S8["Stage 8  HP-K-Anon
    anonymize_record
    out: scrubbed MergedRecord
    K-Anon enforcement missing"]:::warn --> S6

    S6["Stage 6
    build_fhir_resources
    out: list of DomainResource
    Appointment, CarePlan,
    DiagnosticReport omitted"]:::warn --> S7

    subgraph s7group ["Stage 7 + Provenance"]
      S7["Stage 7
      assemble_bundle
      out: FHIR Bundle"]:::core
      S9P["Stage 9-Prov
      build_provenance
      out: Provenance resource
      attester not populated"]:::warn
      S7 --> S9P
      S9P --> S7
    end

    S6 --> S7
    S7 --> S9U

    S9U["Stage 9
    upload_to_fhir
    async PUT per resource"]:::core --> FHIR

    FHIR([FHIR Server]):::io

    classDef core fill:#EEEDFE,stroke:#7F77DD,stroke-width:1px,color:#26215C
    classDef warn fill:#FAEEDA,stroke:#EF9F27,stroke-width:1.5px,color:#412402
    classDef missing fill:#FCEBEB,stroke:#E24B4A,stroke-width:1.5px,color:#501313
    classDef io fill:#E1F5EE,stroke:#1D9E75,stroke-width:1px,color:#04342C
    classDef decision fill:#F1EFE8,stroke:#888780,stroke-width:1px,color:#2C2C2A
`;

const { svg } = await mermaid.render('pipeline-svg', diagram);
document.getElementById('mermaid-container').innerHTML = svg;
</script>
